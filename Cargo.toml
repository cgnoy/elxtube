[package]
name = "elxtube"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "YouTube client vibecoded using gtk4-rust, mpv & ytdlp for old hardware"
license = "GPL-3.0-or-later"
repository = "https://github.com/yenpiaw/elxtube"
authors = ["yenpiaw"]
readme = "README.md"

[lib]
name = "elxtube"
path = "src/lib.rs"

[[bin]]
name = "elxtube"
path = "src/main.rs"
required-features = ["ui"]

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }
ureq = { version = "2", features = ["json"] }

gtk = { version = "0.9", package = "gtk4", optional = true, features = ["v4_10"] }
gdk4-x11 = { version = "0.9", optional = true }
glib = { version = "0.20", optional = true }
libmpv-sys = { version = "3.1.0", optional = true }
libloading = "0.8.9"
rand = "0.9.5"

[features]
default = ["ui"]
ui = ["gtk", "glib", "libmpv-sys", "gdk4-x11"]

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = 1
incremental = true
split-debuginfo = "off"

[profile.dev.package."*"]
opt-level = 2
