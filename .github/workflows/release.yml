name: Build Linux packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: write

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold rpm podman pkg-config libgtk-4-dev libmpv-dev
      - name: Build release bundle
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
        run: |
          set -o pipefail
          bash packaging/build-bundle.sh 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          {
            echo "### Build log"
            echo '```text'
            cat build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: build.log
      - name: Publish public build diagnostic
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            printf 'Run: %s\nCommit: %s\n\n```text\n' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "${{ github.sha }}"
            cat build.log
            printf '\n```\n'
          } > build-diagnostic.md
          gh issue create \
            --title "CI build diagnostic ${{ github.run_id }}" \
            --body-file build-diagnostic.md
      - name: Build Debian package
        run: bash packaging/build-deb.sh
      - name: Build RPM package
        run: bash packaging/build-rpm.sh
      - name: Build Arch package
        run: |
          podman run --rm -e ELXTUBE_SKIP_BUILD=1 -v "$PWD:/workspace:Z" \
            docker.io/library/archlinux:latest \
            bash -lc "pacman -Syu --noconfirm fakeroot gtk4 mpv python >/dev/null && chmod -R a+rwX /workspace && setpriv --reuid=nobody --regid=nobody --clear-groups bash -c 'cd /workspace && bash packaging/build-arch.sh'"
      - name: Build AppImage
        run: bash packaging/build-appimage.sh
      - name: Generate checksums
        run: sha256sum dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*.AppImage > dist/SHA256SUMS
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elxtube-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
            dist/SHA256SUMS
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*.AppImage dist/SHA256SUMS \
            --generate-notes --title "elxTube $GITHUB_REF_NAME"
